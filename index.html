{i:"🪟",g:"from-teal-500 to-slate-700",u:"images/image 1.jpeg"},
{i:"🚪",g:"from-slate-600 to-teal-700",u:"images/image 2.jpeg"},
{i:"🔷",g:"from-sky-500 to-slate-800",u:"images/image 3.jpg"}
];

const $=s=>document.querySelector(s);

$("#svcGrid").innerHTML=svc.map((s,n)=>`

 <div class="relative h-48 overflow-hidden bg-gradient-to-br ${s.g} flex items-center justify-center">
  <span class="ic text-6xl">${s.i}</span>
  ${s.u && s.u !== "#"?`<img src="${s.u}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">`:""}
 </div>
 <div class="p-6"><h3 class="font-bold text-lg" data-i18n="s${n+1}"></h3><p class="mt-2 text-slate-600 text-sm leading-relaxed" data-i18n="d${n+1}"></p></div>
</article>`).join("");

const names=["Sarah L., Markham","David C., Scarborough","Grace W., Richmond Hill","Tom K., Mississauga","Linda H., North York"];
const card=(n,i)=>`<div class="w-80 shrink-0 bg-slate-800 rounded-2xl p-6 border border-slate-700"><div class="text-amber-400 tracking-widest">★★★★★</div><p class="mt-3 text-slate-200 text-sm leading-relaxed" data-i18n="r${i+1}"></p><p class="mt-4 text-teal-300 text-sm font-semibold">— ${n}</p></div>`;
$("#revTrack").innerHTML=names.map(card).join("")+names.map(card).join("");

function setLang(l){
 lang=l;document.documentElement.lang=l==="zh"?"zh-Hant":l;
 document.querySelectorAll("[data-i18n]").forEach(e=>{const v=T[l][e.dataset.i18n];if(v)e.textContent=v});
 const sel=$("#svcSel");if(sel){const cur=sel.selectedIndex;sel.innerHTML=[1,2,3,4,5].map(n=>`<option>${T[l]["s"+n]}</option>`).join("");sel.selectedIndex=Math.max(cur,0)}
 document.querySelectorAll(".lang").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
 try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>setLang(b.dataset.l));

$("#burger").onclick=()=>{const m=$("#mnav");m.classList.toggle("hidden");m.classList.toggle("flex")};
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener("click",e=>{
 const t=document.querySelector(a.getAttribute("href"));if(!t)return;
 e.preventDefault();$("#mnav").classList.add("hidden");$("#mnav").classList.remove("flex");
 t.scrollIntoView({behavior:"smooth",block:"start"});
}));

document.querySelectorAll(".ripple").forEach(b=>b.addEventListener("click",e=>{
 const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
 s.className="r";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
 b.appendChild(s);setTimeout(()=>s.remove(),650);
}));
$("#heroBtn").addEventListener("click",()=>setTimeout(()=>$("#contact").scrollIntoView({behavior:"smooth"}),350));

$("#wcBtn").onclick=()=>{$("#wcModal").classList.replace("hidden","flex")};
const closeWc=()=>$("#wcModal").classList.replace("flex","hidden");
$("#wcClose").onclick=closeWc;$("#wcModal").onclick=e=>{if(e.target.id==="wcModal")closeWc()};

let saved="en";try{saved=localStorage.getItem("lang")||"en"}catch(e){}
setLang(T[saved]?saved:"en");
</script>
